# Full Research Workflow
# Performs web search and optionally emails results

name: research
description: Research a topic and optionally email the findings
version: 1.0.0

inputs:
  topic:
    type: string
    required: true
    description: The topic to research
  email_to:
    type: string
    required: false
    description: Email address to send results to
  search_engine:
    type: string
    default: google
    description: Search engine to use (google, duckduckgo, bing)

steps:
  - id: build_search_url
    type: template
    template: |
      {% if search_engine == "google" %}
      https://google.com/search?q={{ topic | urlencode }}
      {% elif search_engine == "duckduckgo" %}
      https://duckduckgo.com/?q={{ topic | urlencode }}
      {% else %}
      https://bing.com/search?q={{ topic | urlencode }}
      {% endif %}
    output: search_url

  - id: navigate_to_search
    daemon: browser
    method: open
    params:
      url: "{{ search_url }}"
    depends_on: [build_search_url]

  - id: wait_for_results
    type: sleep
    duration_ms: 1000
    depends_on: [navigate_to_search]

  - id: get_page_content
    daemon: browser
    method: snapshot
    depends_on: [wait_for_results]
    output: page_content

  - id: extract_results
    type: transform
    input: "{{ page_content }}"
    transform: |
      # Extract search results from ARIA tree
      # Returns structured data with titles, URLs, snippets
    output: search_results

  - id: format_summary
    type: template
    template: |
      # Research Results: {{ topic }}

      ## Summary
      Found {{ search_results | length }} results for "{{ topic }}".

      ## Top Results
      {% for result in search_results[:5] %}
      - **{{ result.title }}**
        {{ result.snippet }}
        [Link]({{ result.url }})
      {% endfor %}

      ---
      Generated by FGP Research Assistant
    output: summary
    depends_on: [extract_results]

  - id: send_email
    daemon: gmail
    method: send
    condition: "{{ email_to is defined and email_to != '' }}"
    params:
      to: "{{ email_to }}"
      subject: "Research: {{ topic }}"
      body: "{{ summary }}"
    depends_on: [format_summary]

outputs:
  summary: "{{ summary }}"
  results: "{{ search_results }}"
  email_sent: "{{ send_email.success | default(false) }}"

error_handling:
  on_browser_error:
    message: "Browser daemon not available. Start with: fgp start browser"
    retry: false
  on_gmail_error:
    message: "Email could not be sent. Gmail daemon may not be configured."
    continue: true  # Don't fail the whole workflow
